<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Leons Group · Chat Interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
<script src="/os/theme.js"></script>
<link rel="stylesheet" href="/os/sp-os.css">
<style>
  .ibx{display:flex;height:100%;min-height:0}
  .ibx-list{width:320px;flex-shrink:0;border-right:1px solid var(--border-soft);display:flex;flex-direction:column;min-height:0;background:var(--bg-0)}
  .ibx-list__top{padding:var(--s2) var(--s2) 8px;border-bottom:1px solid var(--border-soft)}
  .ibx-list__top h3{font-family:var(--f-title);font-size:11.5px;color:var(--text-2);letter-spacing:.14em;text-transform:uppercase;font-weight:500;margin-bottom:10px}
  .ibx-scroll{flex:1;overflow-y:auto;min-height:0}
  .ibx-item{display:flex;gap:11px;padding:11px var(--s2);cursor:pointer;border-bottom:1px solid var(--border-soft);transition:background .12s;position:relative}
  .ibx-item:hover{background:var(--bg-1)}
  .ibx-item.active{background:var(--bg-2)}
  .ibx-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);border-radius:0 2px 2px 0}
  .ibx-item__av{position:relative;flex-shrink:0}
  .ibx-item__info{flex:1;min-width:0}
  .ibx-item__top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .ibx-item__name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .ibx-item.unread .ibx-item__name{font-weight:700}
  .ibx-item__time{font-size:11px;color:var(--text-3);flex-shrink:0;font-variant-numeric:tabular-nums}
  .ibx-item__bot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}
  .ibx-item__prev{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .ibx-item.unread .ibx-item__prev{color:var(--text-2);font-weight:500}
  .ibx-badge{background:var(--gold);color:#000;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
  .ibx-gen-icon{width:38px;height:38px;border-radius:12px;background:var(--grad-gold-deep);display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .ibx-dm-avs{display:flex;flex-shrink:0}
  .ibx-dm-avs .avatar{margin-left:-6px;border:2px solid var(--bg-0)}
  .ibx-dm-avs .avatar:first-child{margin-left:0}
  .ibx-thread{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-0)}
  .ibx-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s2);color:var(--text-3);text-align:center}
  .ibx-empty svg{width:48px;height:48px;opacity:.2}
  .ibx-thead{height:62px;flex-shrink:0;display:flex;align-items:center;gap:11px;padding:0 var(--s3);border-bottom:1px solid var(--border-soft);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .ibx-thead__name{font-size:14px;font-weight:600;color:var(--text)}
  .ibx-thead__sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
  .ibx-msgs{flex:1;overflow-y:auto;min-height:0;padding:var(--s2) var(--s3);display:flex;flex-direction:column;gap:4px}
  .ibx-daysep{align-self:center;font-size:11px;color:var(--text-3);background:var(--bg-2);padding:3px 12px;border-radius:999px;margin:6px 0;border:1px solid var(--border-soft)}
  .ibx-compose{flex-shrink:0;padding:10px var(--s3);padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border-soft);background:var(--bg-1);display:flex;flex-direction:column;gap:6px}
  .compose-row{display:flex;gap:8px;align-items:flex-end}
  .compose-pill{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--bg-3);border:1px solid var(--border);border-radius:22px;padding:2px 4px;min-height:44px;transition:border-color .15s}
  .compose-pill:focus-within{border-color:var(--gold-line)}
  .compose-pill textarea{flex:1;min-width:0;width:100%;resize:none;background:transparent;border:none;color:var(--text);padding:10px 8px;font-family:var(--f-ui);font-size:14px;line-height:1.35;max-height:100px;outline:none}
  .compose-pill textarea::placeholder{color:var(--text-3)}
  .icon-btn{background:none;border:none;color:var(--text-3);padding:9px 8px;cursor:pointer;display:flex;align-items:center;transition:color .12s;flex-shrink:0}
  .icon-btn:hover{color:var(--text-2)}
  .icon-btn svg{width:20px;height:20px}
  .fab-send{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#000;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .12s,transform .1s}
  .fab-send:hover{opacity:.85}
  .fab-send:active{transform:scale(.92)}
  .fab-send:disabled{opacity:.3;cursor:not-allowed;transform:none}
  .fab-send svg{width:20px;height:20px}
  .eq-typing-bar{display:none;padding:4px var(--s3);font-size:11px;color:var(--text-3);text-align:center}
  .eq-typing-bar.show{display:block}
  .eq-typing-bar span{display:inline-flex;align-items:center;gap:5px}
  .eq-typing-bar .dots{display:inline-flex;gap:3px}
  .eq-typing-bar .dots i{width:5px;height:5px;border-radius:50%;background:var(--gold);font-style:normal;animation:eqTp 1.2s infinite}
  .eq-typing-bar .dots i:nth-child(2){animation-delay:.2s}
  .eq-typing-bar .dots i:nth-child(3){animation-delay:.4s}
  @keyframes eqTp{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .eq-msg-row{display:flex;gap:8px;margin-bottom:4px;align-items:flex-end}
  .eq-msg-row.mio{justify-content:flex-end}
  .eq-msg-row.otro{justify-content:flex-start}
  .eq-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;overflow:hidden;margin-bottom:2px}
  .eq-avatar img{width:100%;height:100%;object-fit:cover}
  .eq-msg-row.mio .eq-avatar{display:none}
  .eq-msg-grouped .eq-avatar{visibility:hidden}
  .eq-msg-grouped{margin-bottom:1px!important}
  .eq-msg-row.mio .eq-msg-grouped{margin-bottom:1px!important}
  .eq-pin-banner{display:none;padding:8px var(--s3);background:rgba(200,164,90,.08);border-bottom:1px solid var(--border-soft)}
  .eq-pin-banner.show{display:flex;align-items:center;gap:8px}
  .eq-pin-banner__icon{font-size:14px;flex-shrink:0}
  .eq-pin-banner__text{flex:1;min-width:0}
  .eq-pin-banner__label{font-size:10px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .eq-pin-banner__body{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eq-pin-banner__clear{background:none;border:none;color:var(--text-3);font-size:16px;padding:4px;cursor:pointer}
  .eq-reply-bar{display:none;padding:8px var(--s3);background:rgba(200,164,90,.06);border-top:1px solid var(--gold);border-bottom:1px solid var(--border-soft);align-items:center;gap:8px}
  .eq-reply-bar.show{display:flex}
  .eq-reply-bar__label{font-size:11px;font-weight:700;color:var(--gold)}
  .eq-reply-bar__preview{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eq-reply-bar__close{background:none;border:none;color:var(--text-3);font-size:18px;cursor:pointer;padding:4px}
  .eq-search-bar{display:none;padding:8px var(--s3);background:var(--bg-1);border-bottom:1px solid var(--border-soft)}
  .eq-search-bar.show{display:flex;align-items:center;gap:8px}
  .eq-search-bar input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-3);color:var(--text);font-size:13px;outline:none}
  .eq-search-bar input:focus{border-color:var(--gold-line)}
  .eq-search-bar__count{font-size:11px;color:var(--text-3);white-space:nowrap}
  .eq-search-bar__close{background:none;border:none;color:var(--text-3);font-size:16px;cursor:pointer;padding:4px}
  .eq-link-preview{margin-top:4px;padding:8px 10px;background:rgba(200,164,90,.06);border:1px solid var(--border-soft);border-radius:8px;max-width:220px}
  .eq-link-preview__title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eq-link-preview__desc{font-size:11px;color:var(--text-3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .eq-link-preview__url{font-size:10px;color:var(--gold);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eq-msg-edited{font-size:9px;color:var(--text-3);font-style:italic;margin-left:4px}
  .eq-msg-check{font-size:10px;margin-left:4px;color:var(--gold)}
  @media(max-width:860px){.ibx-list{width:100%}.ibx-list.hide{display:none}.ibx-thread.hide{display:none}.btn-back{display:flex!important}}
  .btn-back{display:none}
</style>
</head>
<body>
<script src="/os/sp-shell.js"></script>
<script>
(async function(){
'use strict';
const{ICONS,api,toast,avatarColor,initials,fmtPhone}=SPOS;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function timeago(ts){if(!ts)return'';const d=new Date(String(ts).replace(' ','T'));if(isNaN(d))return'';const m=Math.floor((Date.now()-d)/60000);if(m<1)return'ahora';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d';}
function hhmm(ts){const d=new Date(String(ts).replace(' ','T'));return isNaN(d)?'':d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}
function I(d,s){s=s||20;return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="${s}" height="${s}">${d}</svg>`;}
const D={back:'m12 19-7-7 7-7M19 12H5',send:'m22 2-7 20-4-9-9-4ZM22 2 11 13',inbox:'M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13l3.5 7v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-6z',search:'M11 17.25a6.25 6.25 0 1 0 0-12.5 6.25 6.25 0 0 0 0 12.5zM16 16l3.5 3.5',x:'M18 6 6 18M6 6l12 12',reply:'M4 12h11a4 4 0 0 1 4 4v2M4 12l4-4M4 12l4 4',edit:'M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z',forward:'m22 2-7 20-4-9-9-4ZM22 2 11 13',copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',clip:'m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48'};

const EQ_COLORS=['#2E7D46','#5B7B8C','#7C6BB0','#8C4A4A','#4A7A8C','#6B8C4A','#8C6B2A','#4A5B8C','#8C4A6B','#5B8C4A'];
function eqColor(id){return EQ_COLORS[Number(id||0)%EQ_COLORS.length];}
function eqFindVendedor(id){if(Number(id)===0)return{nombre:'Admin',foto:null};return vendedores.find(v=>Number(v.id)===Number(id))||{nombre:'Asesor',foto:null};}
function eqHexToRgba(hex,a){const c=hex.replace('#','');return`rgba(${parseInt(c.substring(0,2),16)},${parseInt(c.substring(2,4),16)},${parseInt(c.substring(4,6),16)},${a})`;}
function eqDayLabel(ts){if(!ts)return'';const d=new Date(String(ts).replace(' ','T'));if(isNaN(d))return'';const now=new Date(),y=new Date(now);y.setDate(y.getDate()-1);if(d.toDateString()===now.toDateString())return'Hoy';if(d.toDateString()===y.toDateString())return'Ayer';return d.toLocaleDateString('es-CO',{day:'numeric',month:'long'});}
function linkify(text){
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" style="color:var(--gold);text-decoration:underline">$1</a>');
}

const ctx=await SPOS.mount({active:'team-chat',title:'Chat Interno',crumb:'Conversaciones del equipo',padded:false,panel:true});
if(!ctx)return;
ctx.content.style.cssText='flex:1;min-height:0;overflow:hidden;padding:0;display:flex';

const listEl=document.createElement('div');listEl.className='ibx-list';listEl.id='eqList';
const threadEl=document.createElement('div');threadEl.className='ibx-thread';threadEl.id='eqThread';
ctx.content.appendChild(listEl);ctx.content.appendChild(threadEl);

let conversations={general:{},dms:[]};
let currentView=null;
let messages=[];
let vendedores=[];
let _replyTo=null;
let _editingId=null;
let _searchMode=false;

listEl.innerHTML=`
  <div class="ibx-list__top">
    <h3>Chat Interno · Equipo</h3>
    <div class="os-search" style="width:100%"><input id="eqQ" placeholder="Buscar en conversaciones…"></div>
  </div>
  <div class="ibx-scroll" id="eqConvs"></div>`;

threadEl.innerHTML=`<div class="ibx-empty" id="eqEmpty">${I(D.inbox,48)}<p>Selecciona una conversación del equipo</p></div><div id="eqChat" style="display:none;flex:1;min-height:0;flex-direction:column;height:100%"></div>`;

async function cargar(){
  const[convData,vendData]=await Promise.all([api('/api/equipo/admin/conversations'),api('/api/vendedores')]);
  if(convData)conversations=convData;
  if(Array.isArray(vendData))vendedores=vendData;
  renderList();
}

function renderList(){
  const box=document.getElementById('eqConvs');if(!box)return;
  const general=conversations.general||{};
  const dms=conversations.dms||[];
  let html='';
  html+=`<div class="ibx-item${currentView===null?' active':''}" data-view="general">
    <div class="ibx-item__av"><div class="ibx-gen-icon">🦁</div></div>
    <div class="ibx-item__info">
      <div class="ibx-item__top"><span class="ibx-item__name" style="color:var(--gold)">Canal General</span><span class="ibx-item__time">${general.last_at?timeago(general.last_at):''}</span></div>
      <div class="ibx-item__bot"><span class="ibx-item__prev">${general.last_from?esc(general.last_from)+': ':''}${esc((general.last_message||'').slice(0,50))}</span>${general.msg_count>0?`<span class="ibx-badge">${general.msg_count}</span>`:''}</div>
    </div></div>`;
  dms.forEach(dm=>{
    const names=dm.names||[];
    const label=names.join(' ↔ ')||'Directo';
    const isActive=currentView!=null&&dm.pair&&dm.pair.includes(Number(currentView));
    html+=`<div class="ibx-item${isActive?' active':''}" data-view="dm_${dm.pair?dm.pair.join('_'):''}">
      <div class="ibx-item__av"><div class="ibx-dm-avs">
        <div class="avatar avatar--sm" style="background:${avatarColor(names[0]||'')}">${initials(names[0]||'?')}</div>
        <div class="avatar avatar--sm" style="background:${avatarColor(names[1]||'')}">${initials(names[1]||'?')}</div>
      </div></div>
      <div class="ibx-item__info">
        <div class="ibx-item__top"><span class="ibx-item__name">${esc(label)}</span><span class="ibx-item__time">${dm.last_at?timeago(dm.last_at):''}</span></div>
        <div class="ibx-item__bot"><span class="ibx-item__prev">${dm.last_from?esc(dm.last_from)+': ':''}${esc((dm.last_message||'').slice(0,40))}</span>${dm.count>0?`<span class="ibx-badge">${dm.count}</span>`:''}</div>
      </div></div>`;
  });
  box.innerHTML=html;
  box.querySelectorAll('[data-view]').forEach(el=>{
    el.addEventListener('click',()=>{
      const v=el.dataset.view;
      if(v==='general')currentView=null;
      else if(v.startsWith('dm_')){const ids=v.replace('dm_','').split('_').map(Number);currentView=ids[0];}
      renderList();abrirChat();
    });
  });
}

async function abrirChat(){
  const $empty=document.getElementById('eqEmpty');
  const $chat=document.getElementById('eqChat');
  if(!$empty||!$chat)return;
  $empty.style.display='none';$chat.style.display='flex';$chat.style.flexDirection='column';$chat.style.flex='1';$chat.style.minHeight='0';$chat.style.height='100%';

  let title='Canal General',sub='Todos los asesores — admin puede escribir';
  if(currentView!=null){const v=vendedores.find(x=>x.id===currentView);title=v?v.nombre:'Directo';sub='Mensaje directo — monitoreado por admin';}

  $chat.innerHTML=`
    <div class="ibx-thead">
      <button class="btn btn--icon btn--quiet btn-back" id="eqBtnBack">${I(D.back)}</button>
      <div style="flex:1;min-width:0">
        <div class="ibx-thead__name">${esc(title)}</div>
        <div class="ibx-thead__sub">${sub}</div>
      </div>
      <button class="icon-btn" id="eqSearchBtn" title="Buscar mensajes">${I(D.search,18)}</button>
      <span class="conn-dot" id="eqConnDot"></span>
    </div>
    <div class="eq-typing-bar" id="eqTypingBar"><span><span class="dots"><i></i><i></i><i></i></span> <span id="eqTypingName"></span></span></div>
    <div id="eqPinBanner" class="eq-pin-banner"></div>
    <div id="eqSearchBar" class="eq-search-bar">
      <input id="eqSearchInput" placeholder="Buscar en este chat…">
      <span class="eq-search-bar__count" id="eqSearchCount"></span>
      <button class="eq-search-bar__close" id="eqSearchClose">${I(D.x,16)}</button>
    </div>
    <div id="eqReplyBar" class="eq-reply-bar">
      <div style="flex:1;min-width:0"><div class="eq-reply-bar__label" id="eqReplyLabel"></div><div class="eq-reply-bar__preview" id="eqReplyPreview"></div></div>
      <button class="eq-reply-bar__close" id="eqReplyClose">✕</button>
    </div>
    <div class="ibx-msgs" id="eqMsgs"><div class="sk" style="height:40px;width:58%;border-radius:12px;align-self:flex-start"></div></div>
    <div class="ibx-compose">
      <div class="compose-row">
        <button class="icon-btn" id="eqClipBtn" title="Adjuntar">${I(D.clip||'m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48',18)}</button>
        <div class="compose-pill">
          <textarea id="eqInput" rows="1" placeholder="Escribe un mensaje…"></textarea>
        </div>
        <button class="fab-send" id="eqSend">${I(D.send,20)}</button>
      </div>
    </div>`;

  document.getElementById('eqBtnBack').addEventListener('click',()=>{currentView=null;renderList();document.getElementById('eqEmpty').style.display='';document.getElementById('eqChat').style.display='none';});
  document.getElementById('eqSend').addEventListener('click',enviarMsg);
  document.getElementById('eqClipBtn').addEventListener('click',eqAbrirAdjuntos);
  eqInitFileInput();
  const inp=document.getElementById('eqInput');
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviarMsg();}
    if(e.key==='Escape'){cancelReply();cancelEdit();closeSearch();}
  });
  inp.addEventListener('input',()=>{enviarTyping();});

  document.getElementById('eqSearchBtn').addEventListener('click',toggleSearch);
  document.getElementById('eqSearchClose').addEventListener('click',closeSearch);
  document.getElementById('eqSearchInput').addEventListener('input',doSearch);
  document.getElementById('eqReplyClose').addEventListener('click',cancelReply);

  await cargarMensajes();
  cargarPinned();
  conectarStreamChat();
}

async function cargarMensajes(){
  const url=currentView!=null?`/api/equipo/admin/messages?type=dm&with=${currentView}`:'/api/equipo/admin/messages?type=general';
  const data=await api(url);
  if(Array.isArray(data)){messages=data;renderMensajes();}
}

function renderMedia(m){
  if(!m.media_type||!m.media_url)return'';
  if(m.media_type==='location'){
    let lat,lng,name,address;
    try{const d=JSON.parse(m.body||m.media_url||'{}');lat=d.latitude;lng=d.longitude;name=d.name;address=d.address;}catch(e){return'📍 Ubicación';}
    const mapsUrl=`https://www.google.com/maps?q=${lat},${lng}`;
    const label=[name,address].filter(Boolean).join(' — ')||'Ubicación';
    const mapId='eqadm_'+((m.id||Math.random().toString(36).slice(2,8)));
    return`<div style="margin-top:4px;border-radius:10px;overflow:hidden;border:1px solid var(--border-soft);cursor:pointer" onclick="window.open('${mapsUrl}','_blank')"><div class="leaflet-map" id="${mapId}" data-lat="${lat}" data-lng="${lng}" style="height:120px;width:100%"></div><div style="padding:8px 10px;display:flex;align-items:center;gap:6px"><span>📍</span><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(label)}</div><div style="font-size:10px;color:var(--text-3)">${lat.toFixed(5)}, ${lng.toFixed(5)}</div></div></div></div>`;
  }
  if(m.media_type==='sticker'){
    const src=m.media_url||'';
    return src?`<div style="margin-top:4px"><img src="${esc(src)}" style="max-width:160px;border-radius:8px;display:block" loading="lazy"></div>`:'';
  }
  if(m.media_type==='audio')return`<div style="margin-top:4px"><audio controls preload="none" src="${esc(m.media_url)}" style="width:200px;height:36px;border-radius:8px"></audio></div>`;
  if(m.media_type==='image')return`<div style="margin-top:4px;cursor:pointer" onclick="eqOpenLB('${esc(m.media_url)}')"><img src="${esc(m.media_url)}" style="max-width:210px;border-radius:10px;display:block" loading="lazy"></div>`;
  if(m.media_type==='video')return`<div style="margin-top:4px"><video src="${esc(m.media_url)}" controls style="max-width:210px;border-radius:10px;display:block"></video></div>`;
  if(m.media_type==='document')return`<a href="${esc(m.media_url)}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:8px 12px;background:rgba(200,164,90,.1);border:1px solid var(--gold);border-radius:10px;color:var(--gold);font-size:12px;text-decoration:none">📄 ${esc(m.media_filename||'Documento')}</a>`;
  return'';
}

function renderQuoteHTML(m){

  return`<div style="margin-bottom:4px;border-left:3px solid var(--gold);padding:4px 8px;font-size:11px;color:var(--text-3);background:rgba(200,164,90,.05);border-radius:4px"><span style="color:var(--gold);font-weight:600">${esc(label)}</span><br>${esc((m.reply_to_body||'').slice(0,100))}</div>`;

function renderMensajes(){
  const box=document.getElementById('eqMsgs');if(!box)return;
  if(!messages.length){box.innerHTML='<div style="text-align:center;color:var(--text-3);padding:40px 20px;font-size:13px">Sin mensajes aún</div>';return;}
  let html='';let lastDay='';
  messages.forEach((m,i)=>{
    const day=eqDayLabel(m.created_at);
    if(day&&day!==lastDay){html+=`<div class="ibx-daysep">${day}</div>`;lastDay=day;}
    const isAdmin=Number(m.from_vendedor_id)===0;
    const v=eqFindVendedor(m.from_vendedor_id);
    const prev=messages[i-1];
    const grouped=prev&&!prev.deleted&&prev.from_vendedor_id===m.from_vendedor_id&&(new Date(String(m.created_at).replace(' ','T'))-new Date(String(prev.created_at).replace(' ','T')))<120000;
    const avatarBg=v.foto?'':`background:${eqColor(m.from_vendedor_id)}`;
    const avatarContent=v.foto?`<img src="${esc(v.foto)}" alt="">`:initials(v.nombre);
    const pinIcon=m.pinned_at?' 📌':'';
    const editIcon=m.edited_at?'<span class="eq-msg-edited">editado</span>':'';
    const readCheck=m.to_vendedor_id&&isAdmin?(m.read_at?'<span class="eq-msg-check">✓✓</span>':'<span class="eq-msg-check" style="opacity:.4">✓</span>'):'';
    if(m.deleted){
      html+=`<div class="eq-msg-row ${isAdmin?'mio':'otro'}"><div class="bubble bubble--admin" style="max-width:70%;opacity:.5;font-style:italic"><span>Mensaje eliminado</span><div class="bubble__t">${hhmm(m.created_at)}</div></div></div>`;
      return;
    }
    const vc=eqColor(m.from_vendedor_id);
    const bubBg=isAdmin?'':`background:${eqHexToRgba(vc,.15)};border-left:3px solid ${vc};`;
    html+=`<div class="eq-msg-row ${isAdmin?'mio':'otro'}${grouped?' eq-msg-grouped':''}" data-msgid="${m.id}" oncontextmenu="eqCtxMenu(event,${m.id})">
      ${!isAdmin?`<div class="eq-avatar" style="${avatarBg}">${avatarContent}</div>`:''}
      <div class="bubble ${isAdmin?'bubble--admin':'bubble--in'}" style="max-width:70%;${bubBg}">
        ${!isAdmin&&!grouped?`<div style="font-size:10.5px;font-weight:700;color:${vc};margin-bottom:2px">${esc(v.nombre)}</div>`:''}
        ${renderQuoteHTML(m)}
        ${renderMedia(m)}
        ${m.body?`<span>${linkify(m.body)}${pinIcon}${editIcon}</span>`:''}
        <div class="bubble__t">${hhmm(m.created_at)}${readCheck}</div>
      </div></div>`;
  });
  box.innerHTML=html;
  box.scrollTop=box.scrollHeight;
  // Init Leaflet maps for location messages
  setTimeout(async()=>{
    const mapEls=box.querySelectorAll('.leaflet-map:not(.leaflet-container)');
    if(!mapEls.length)return;
    try{
      if(!window.L){
        const css=document.createElement('link');css.rel='stylesheet';css.href='/vendor/leaflet/leaflet.css';document.head.appendChild(css);
        await new Promise((res,rej)=>{const s=document.createElement('script');s.src='/vendor/leaflet/leaflet.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
      }
      mapEls.forEach(el=>{
        const lat=parseFloat(el.dataset.lat);const lng=parseFloat(el.dataset.lng);
        if(isNaN(lat)||isNaN(lng))return;
        try{
          const map=L.map(el,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,touchZoom:false,doubleClickZoom:false}).setView([lat,lng],15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);
          L.marker([lat,lng]).addTo(map);
          setTimeout(()=>map.invalidateSize(),100);
        }catch(e){}
      });
    }catch(e){}
  },100);
}

window.eqCtxMenu=function(e,msgId){
  e.preventDefault();

  const items=[
    {label:'💬 Responder',action:'reply'},
    {label:'📌 Fijar',action:'pin'},
    {label:'✏️ Editar',action:'edit'},
    {label:'↪️ Reenviar',action:'forward'},
    {label:'📋 Copiar',action:'copy'},
  ];
  if(isMio)items.push({label:'🗑️ Eliminar',action:'delete'});

  const popup=document.createElement('div');
  popup.id='eqCtxPopup';
  popup.style.cssText='position:fixed;z-index:100;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:4px;min-width:160px';
  popup.innerHTML=html;
  popup.style.left=Math.min(e.clientX,window.innerWidth-180)+'px';
  popup.style.top=Math.min(e.clientY,window.innerHeight-250)+'px';
  document.body.appendChild(popup);
  popup.querySelectorAll('[data-eqact]').forEach(el=>{
    el.addEventListener('click',()=>{
      const act=el.dataset.eqact;const mid=Number(el.dataset.msgid);
      popup.remove();
      if(act==='reply')startReply(mid);
      else if(act==='pin')togglePin(mid);
      else if(act==='edit')startEdit(mid);
      else if(act==='forward')forwardMsg(mid);
      else if(act==='copy')copyMsg(mid);
      else if(act==='delete')deleteMsg(mid);
    });
    el.addEventListener('mouseenter',()=>el.style.background='var(--bg-3)');
    el.addEventListener('mouseleave',()=>el.style.background='');
  });
  setTimeout(()=>{document.addEventListener('click',function h(){popup.remove();document.removeEventListener('click',h);},{once:true});},10);

function startReply(msgId){
  const msg=messages.find(x=>x.id===msgId);if(!msg)return;
  _replyTo=msg;
  const bar=document.getElementById('eqReplyBar');if(bar)bar.classList.add('show');
  const lbl=document.getElementById('eqReplyLabel');if(lbl)lbl.textContent='Respondiendo a '+(msg.from_nombre_full||msg.from_nombre||'Asesor');
  const prev=document.getElementById('eqReplyPreview');if(prev)prev.textContent=(msg.body||'').slice(0,80);
  document.getElementById('eqInput').focus();
}
function cancelReply(){_replyTo=null;const bar=document.getElementById('eqReplyBar');if(bar)bar.classList.remove('show');}

function startEdit(msgId){
  const msg=messages.find(x=>x.id===msgId);if(!msg)return;
  _editingId=msgId;
  const inp=document.getElementById('eqInput');if(inp){inp.value=msg.body||'';inp.focus();}
  const pill=document.querySelector('.compose-pill');if(pill)pill.style.borderColor='var(--gold)';
}
function cancelEdit(){_editingId=null;const pill=document.querySelector('.compose-pill');if(pill)pill.style.borderColor='';}

async function togglePin(msgId){
  const r=await api('/api/equipo/messages/'+msgId+'/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
  if(r&&r.ok){toast(r.pinned?'📌 Mensaje fijado':'Mensaje desfijado');cargarPinned();}
}

async function forwardMsg(msgId){
  const names=vendedores.map(v=>`${v.id}:${v.nombre}`);
  const items=[' Canal General →',...vendedores.map(v=>` ${v.nombre} →`)];
  let html='<div style="padding:4px 0">'+items.map((it,i)=>`<div class="ctx-item" data-fwd="${i===0?'general':vendedores[i-1]?.id||''}" style="display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-radius:8px;transition:background .1s;font-size:13px">↪️${it}</div>`).join('')+'</div>';
  const popup=document.createElement('div');
  popup.style.cssText='position:fixed;z-index:100;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:4px;min-width:200px;left:50%;top:50%;transform:translate(-50%,-50%)';
  popup.innerHTML=html;
  document.body.appendChild(popup);
  popup.querySelectorAll('[data-fwd]').forEach(el=>{
    el.addEventListener('click',async()=>{
      const to=el.dataset.fwd==='general'?null:Number(el.dataset.fwd);
      popup.remove();
      const r=await api('/api/equipo/messages/'+msgId+'/forward',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to})});
      if(r&&r.mensaje){toast('↪️ Mensaje reenviado');}
      else toast('Error al reenviar','err');
    });
    el.addEventListener('mouseenter',()=>el.style.background='var(--bg-3)');
    el.addEventListener('mouseleave',()=>el.style.background='');
  });
  setTimeout(()=>{document.addEventListener('click',function h(){if(popup.parentNode)popup.remove();document.removeEventListener('click',h);},{once:true});},10);

function copyMsg(msgId){
  const msg=messages.find(x=>x.id===msgId);if(!msg)return;
  navigator.clipboard.writeText(msg.body||'').then(()=>toast('📋 Copiado')).catch(()=>{});
}

async function deleteMsg(msgId){
  if(!confirm('¿Eliminar este mensaje?'))return;
  const r=await api('/api/equipo/messages/'+msgId+'/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'everyone'})});
  if(r&&r.ok){toast('Mensaje eliminado');cargarMensajes();}
}

async function enviarMsg(){
  const inp=document.getElementById('eqInput');
  const body=(inp.value||'').trim();if(!body&&!_editingId)return;
  inp.value='';
  if(_editingId){
    const r=await api('/api/equipo/messages/'+_editingId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});
    cancelEdit();
    if(r&&r.message){const idx=messages.findIndex(x=>x.id===_editingId);if(idx>=0)messages[idx]=r.message;renderMensajes();}
    else toast('Error al editar','err');
    return;
  }
  const payload={body};
  if(currentView!=null)payload.to=currentView;
  if(_replyTo){payload.replyTo=_replyTo.id;cancelReply();}
  const r=await api('/api/equipo/mensajes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(r&&r.mensaje){messages.push(r.mensaje);renderMensajes();}
  else toast('Error al enviar','err');
}

let _eqFileInput=null;
function eqInitFileInput(){
  if(_eqFileInput)return;
  _eqFileInput=document.createElement('input');_eqFileInput.type='file';_eqFileInput.style.display='none';_eqFileInput.accept='image/*,video/*,.pdf,.doc,.docx';
  _eqFileInput.onchange=async()=>{
    const file=_eqFileInput.files[0];if(!file)return;_eqFileInput.value='';
    if((file.type||'').startsWith('image/')){
      // Preview antes de enviar
      const ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px';
      const dataUrl=URL.createObjectURL(file);
      ov.innerHTML=`<img src="${dataUrl}" style="max-width:400px;max-height:50vh;border-radius:12px;object-fit:contain"><textarea id="eqAdmCap" placeholder="Caption (opcional)…" rows="2" style="width:100%;max-width:400px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-3);color:var(--text);font-size:13px;font-family:inherit;resize:none;outline:none"></textarea><div style="display:flex;gap:10px"><button id="eqAdmCapCancel" style="padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:var(--bg-3);color:var(--text);cursor:pointer;font-size:13px">Cancelar</button><button id="eqAdmCapSend" style="padding:10px 20px;border-radius:8px;border:none;background:var(--gold);color:#000;cursor:pointer;font-size:13px;font-weight:600">Enviar</button></div>`;
      document.body.appendChild(ov);
      ov.querySelector('#eqAdmCapCancel').onclick=()=>{ov.remove();URL.revokeObjectURL(dataUrl);};
      ov.querySelector('#eqAdmCapSend').onclick=async()=>{
        ov.remove();URL.revokeObjectURL(dataUrl);
        const toBase64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
        const dataBase64=await toBase64(file);
        const caption=ov.querySelector('#eqAdmCap')?.value||'';
        await eqAdmSendMedia(dataBase64,file.type||'image/jpeg',caption);
      };
      return;
    }
    // Video/documento: enviar directo
    const toBase64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
    const dataBase64=await toBase64(file);
    await eqAdmSendMedia(dataBase64,file.type||'application/octet-stream','');
  };
  document.body.appendChild(_eqFileInput);
}
async function eqAdmSendMedia(dataBase64,mime,caption){
  const mediaType=mime.startsWith('image/')?'image':mime.startsWith('video/')?'video':mime.startsWith('audio/')?'audio':'document';
  const payload={body:caption||'',media_type:mediaType,media_url:'data:'+mime+';base64,'+dataBase64};
  if(currentView!=null)payload.to=currentView;
  const r=await api('/api/equipo/mensajes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(r&&r.mensaje){messages.push(r.mensaje);renderMensajes();toast('Enviado');}
  else toast('Error al enviar','err');
}

  });

function eqAbrirUbicacion(){
  const DEFAULT_POS={lat:4.7110,lng:-74.0721};
  let picker={lat:DEFAULT_POS.lat,lng:DEFAULT_POS.lng,name:'',address:''};
  let pMap=null,pMarker=null;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0';
  ov.innerHTML=`<div style="width:100%;max-width:500px;background:var(--bg-2);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;max-height:90vh">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:14px">Enviar ubicación</span><button id="eqLocClose" style="background:none;border:none;color:var(--text-3);font-size:18px;cursor:pointer">✕</button></div>
    <div id="eqAdmLocMap" style="height:250px;position:relative"><button id="eqAdmLocate" style="position:absolute;top:10px;right:10px;z-index:400;width:36px;height:36px;border-radius:50%;border:none;background:var(--gold);color:#000;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)">🎯</button></div>
    <div style="padding:8px 16px;font-size:12px;color:var(--text-3)" id="eqAdmLocAddr">Obteniendo ubicación…</div>
    <div style="padding:0 16px 8px"><input id="eqAdmLocSearch" placeholder="Buscar lugar…" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-3);color:var(--text);font-size:13px;outline:none"><div id="eqAdmLocResults" style="display:none"></div></div>
    <button id="eqAdmLocSend" style="margin:0 16px 16px;padding:12px;border-radius:10px;border:none;background:var(--gold);color:#000;font-weight:600;font-size:14px;cursor:pointer">📍 Enviar esta ubicación</button>
  </div>`;
  document.body.appendChild(ov);
  const addrEl=ov.querySelector('#eqAdmLocAddr');
  const setAddr=(txt)=>{if(addrEl)addrEl.textContent=txt;};
  const movePicker=async(lat,lng,{name='',address='',skipGeocode=false}={})=>{
    picker={lat,lng,name,address};
    if(pMarker)pMarker.setLatLng([lat,lng]);
    if(pMap)pMap.setView([lat,lng],pMap.getZoom()<14?15:pMap.getZoom());
    if(address){setAddr(name?`${name} — ${address}`:address);return;}
    if(skipGeocode)return;
    setAddr('Buscando dirección…');
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=es`);const d=await r.json();const n=d.name||(d.display_name?d.display_name.split(',')[0]:'');const a=d.display_name||'';picker.name=n;picker.address=a;setAddr(a||`${lat.toFixed(5)}, ${lng.toFixed(5)}`);}
    catch(e){setAddr(`${lat.toFixed(5)}, ${lng.toFixed(5)}`);}
  };
  (async()=>{
    const mapEl=ov.querySelector('#eqAdmLocMap');if(!mapEl)return;
    try{
      const css=document.createElement('link');css.rel='stylesheet';css.href='/vendor/leaflet/leaflet.css';document.head.appendChild(css);
      if(!window.L){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='/vendor/leaflet/leaflet.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
    }catch(e){return;}
    if(!ov.parentNode)return;
    pMap=L.map(mapEl,{zoomControl:false,attributionControl:false}).setView([picker.lat,picker.lng],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(pMap);
    pMarker=L.marker([picker.lat,picker.lng],{draggable:true}).addTo(pMap);
    pMarker.on('dragend',()=>{const p=pMarker.getLatLng();movePicker(p.lat,p.lng);});
    pMap.on('click',e=>movePicker(e.latlng.lat,e.latlng.lng));
    setTimeout(()=>pMap&&pMap.invalidateSize(),150);
    try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),rej,{enableHighAccuracy:true,timeout:10000}));if(ov.parentNode){movePicker(pos.lat,pos.lng);pMap.setView([pos.lat,pos.lng],16);}}
    catch(e){setAddr('Activa GPS o marca el punto en el mapa');}
  })();
  ov.querySelector('#eqLocClose').onclick=()=>ov.remove();
  const locateBtn=ov.querySelector('#eqAdmLocate');
  if(locateBtn)locateBtn.onclick=async()=>{
    setAddr('Obteniendo tu ubicación…');
    try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),rej,{enableHighAccuracy:true,timeout:10000}));movePicker(pos.lat,pos.lng);if(pMap)pMap.setView([pos.lat,pos.lng],16);}
    catch(e){setAddr('GPS no disponible — marca en el mapa');}
  };
  ov.querySelector('#eqAdmLocSend').onclick=async()=>{
    const{lat,lng,name,address}=picker;
    ov.remove();
    const locBody=JSON.stringify({latitude:lat,longitude:lng,name,address});
    const payload={body:locBody,media_type:'location',media_url:locBody};
    if(currentView!=null)payload.to=currentView;
    const r=await api('/api/equipo/mensajes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(r&&r.mensaje){messages.push(r.mensaje);renderMensajes();toast('📍 Ubicación enviada');}
    else toast('Error al enviar ubicación','err');
  };
  let searchTimer;
  const searchInput=ov.querySelector('#eqAdmLocSearch');const resultsEl=ov.querySelector('#eqAdmLocResults');
  if(searchInput){
    searchInput.oninput=()=>{
      clearTimeout(searchTimer);const q=searchInput.value.trim();
      if(q.length<3){resultsEl.style.display='none';return;}
      searchTimer=setTimeout(async()=>{
        try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&limit=5&accept-language=es`);const data=await r.json();
          if(data&&data.length){resultsEl.innerHTML=data.map((res,i)=>`<button data-idx="${i}" style="display:flex;align-items:center;gap:6px;width:100%;padding:8px;background:none;border:none;border-bottom:1px solid var(--border-soft);color:var(--text);cursor:pointer;font-size:12px;text-align:left"><span>📍</span><span>${esc(res.display_name)}</span></button>`).join('');resultsEl.style.display='block';
            resultsEl.querySelectorAll('[data-idx]').forEach(btn=>btn.onclick=()=>{const r2=data[parseInt(btn.dataset.idx)];resultsEl.style.display='none';searchInput.value=r2.display_name;movePicker(parseFloat(r2.lat),parseFloat(r2.lon),{name:r2.name||'',address:r2.display_name||''});});
          }else{resultsEl.innerHTML='<div style="padding:8px;color:var(--text-3);font-size:12px">Sin resultados</div>';resultsEl.style.display='block';}
        }catch(e){}
      },400);
    };
  }
}

function toggleSearch(){
  const bar=document.getElementById('eqSearchBar');
  if(bar)bar.classList.toggle('show');
  if(bar&&bar.classList.contains('show')){document.getElementById('eqSearchInput').focus();_searchMode=true;}
  else closeSearch();
}
function closeSearch(){
  const bar=document.getElementById('eqSearchBar');if(bar)bar.classList.remove('show');
  const inp=document.getElementById('eqSearchInput');if(inp)inp.value='';
  const cnt=document.getElementById('eqSearchCount');if(cnt)cnt.textContent='';
  _searchMode=false;
  renderMensajes();
}
let _searchTimer=null;
async function doSearch(){
  clearTimeout(_searchTimer);
  const q=(document.getElementById('eqSearchInput')?.value||'').trim();
  _searchTimer=setTimeout(async()=>{
    if(!q){renderMensajes();return;}
    const ch=currentView!=null?String(currentView):'general';
    const r=await api('/api/equipo/search?q='+encodeURIComponent(q)+'&channel='+encodeURIComponent(ch));
    if(Array.isArray(r)){messages=r;renderMensajes();}
    const cnt=document.getElementById('eqSearchCount');if(cnt)cnt.textContent=r?r.length+' resultados':'';
  },300);
}

async function cargarPinned(){
  const ch=currentView!=null?String(currentView):'general';
  const r=await api('/api/equipo/pinned?channel='+encodeURIComponent(ch));
  const banner=document.getElementById('eqPinBanner');if(!banner)return;
  if(r){
    const from=r.from_nombre_full||r.from_nombre||'Asesor';
    banner.innerHTML=`<span class="eq-pin-banner__icon">📌</span><div class="eq-pin-banner__text"><div class="eq-pin-banner__label">Fijado por ${esc(from)}</div><div class="eq-pin-banner__body">${esc((r.body||'').slice(0,80))}</div></div><button class="eq-pin-banner__clear" id="eqUnpinBtn">✕</button>`;
    banner.classList.add('show');
    document.getElementById('eqUnpinBtn').addEventListener('click',async()=>{
      await api('/api/equipo/messages/'+r.id+'/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
      banner.classList.remove('show');
    });
  }else{banner.classList.remove('show');}
}

let _typingLast=0;
function enviarTyping(){
  const now=Date.now();if(now-_typingLast<3000)return;_typingLast=now;
  api('/api/equipo/typing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:currentView})});
}

let _chatStream=null;
function conectarStreamChat(){
  if(_chatStream){_chatStream.close();_chatStream=null;}
  try{
    _chatStream=new EventSource('/api/stream');
    const dot=()=>document.getElementById('eqConnDot');
    _chatStream.onopen=()=>dot()?.classList.add('on');
    _chatStream.addEventListener('conectado',()=>dot()?.classList.add('on'));
    _chatStream.addEventListener('equipo_mensaje',ev=>{
      try{const m=JSON.parse(ev.data);if(currentView==null&&!_searchMode){messages.push(m);renderMensajes();hideTyping();}}catch(e){}
    });
    _chatStream.addEventListener('equipo_directo',ev=>{
      try{const m=JSON.parse(ev.data);if(currentView!=null&&(Number(m.from_vendedor_id)===currentView||Number(m.to_vendedor_id)===currentView)&&!_searchMode){messages.push(m);renderMensajes();hideTyping();}}catch(e){}
    });
    _chatStream.addEventListener('equipo_typing',ev=>{
      try{const t=JSON.parse(ev.data);if(Number(t.from_id)===0)return;const bar=document.getElementById('eqTypingBar');const nm=document.getElementById('eqTypingName');if(bar&&nm){const canal=t.to==null&&currentView==null;const dm=t.to!=null&&currentView!=null&&Number(t.from_id)===currentView;if(canal||dm){nm.textContent=t.from_nombre+' está escribiendo…';bar.classList.add('show');setTimeout(()=>bar.classList.remove('show'),5000);}}}catch(e){}
    });
    _chatStream.addEventListener('equipo_message_pinned',()=>{cargarPinned();});
    _chatStream.addEventListener('equipo_message_edited',ev=>{
      try{const d=JSON.parse(ev.data);const idx=messages.findIndex(x=>x.id===d.message_id);if(idx>=0){messages[idx].body=d.body;messages[idx].edited_at=d.edited_at;renderMensajes();}}catch(e){}
    });
    _chatStream.onerror=()=>{dot()?.classList.remove('on');_chatStream.close();setTimeout(conectarStreamChat,5000);};
  }catch(e){}
}

function hideTyping(){const bar=document.getElementById('eqTypingBar');if(bar)bar.classList.remove('show');}

await cargar();
conectarStreamChat();
})();
</script>
