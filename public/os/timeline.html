<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Leons Group · Centro de Notificaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
<script src="/os/theme.js"></script>
<link rel="stylesheet" href="/os/sp-os.css">
<style>
.evt { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background .15s; }
.evt:hover { background: var(--bg-2); }
.evt.no-leido { background: rgba(212,175,55,.04); }
.evt-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.evt-dot.lead { background: var(--blue); }
.evt-dot.alerta { background: var(--red); }
.evt-dot.venta { background: var(--green); }
.evt-dot.operacion { background: var(--gold); }
.evt-dot.equipo { background: var(--text-3); }
.evt-titulo { font-size: 13.5px; font-weight: 600; }
.evt-desc { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.evt-time { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.evt-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .03em; }
</style>
</head>
<body>
<script src="/os/sp-shell.js"></script>
<script>
(async function () {
  const { ICONS, api } = SPOS;
  const ctx = await SPOS.mount({ active: 'timeline', title: 'Centro de Notificaciones', crumb: 'Leons Group · Timeline de eventos', padded: true });

  const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const CAT_COLORS = { lead: 'lead', alertas: 'alerta', ventas: 'venta', operaciones: 'operacion', equipo: 'equipo', ia: 'operacion' };
  const CAT_LABELS = { lead: 'Lead', alertas: 'Alerta', ventas: 'Venta', operaciones: 'Operación', equipo: 'Equipo', ia: 'IA' };
  const CAT_BADGE = { lead: 'badge--blue', alertas: 'badge--red', ventas: 'badge--green', operaciones: 'badge--gold', equipo: 'badge--mute', ia: 'badge--amber' };

  let eventos = [];
  let unreadCount = 0;
  let filtro = '';

  ctx.content.innerHTML = `
   <div class="os-content__max">
    <div class="u-between" style="margin-bottom:var(--s3)">
      <div>
        <div class="t-h2">Centro de Notificaciones</div>
        <div class="t-dim3" style="font-size:13px;margin-top:4px" id="evResumen">—</div>
      </div>
      <div class="u-row u-gap2">
        <span id="unreadBadge" class="s5_badge" style="display:none;font-size:11px;font-weight:600;color:#0A0A0A;background:var(--gold);padding:2px 10px;border-radius:20px">0</span>
        <button class="btn btn--ghost btn--sm" id="btnMarkAll">Todo leído</button>
        <select class="input" id="filtroCat" style="width:auto">
          <option value="">Todas las categorías</option>
          <option value="leads">Leads</option>
          <option value="alertas">Alertas</option>
          <option value="ventas">Ventas</option>
          <option value="operaciones">Operaciones</option>
          <option value="equipo">Equipo</option>
          <option value="ia">IA</option>
        </select>
      </div>
    </div>
    <div class="card" style="padding:var(--s2) var(--s3)">
      <div id="evLista" style="min-height:200px"><div class="empty">Cargando eventos…</div></div>
    </div>
   </div>`;

  document.getElementById('filtroCat').addEventListener('change', e => { filtro = e.target.value; render(); });
  document.getElementById('btnMarkAll').addEventListener('click', async () => {
    await api('/api/events/read-all', { method: 'POST' });
    eventos.forEach(e => e.leido = 1);
    unreadCount = 0;
    render();
    SPS.toast('Todos marcados como leídos', 'ok');
  });

  async function cargar() {
    const [evts, unread] = await Promise.all([
      api('/api/events?limite=100'),
      api('/api/events/unread-count'),
    ]);
    eventos = evts || [];
    unreadCount = unread ? unread.count : 0;
    render();
  }

  function render() {
    let list = eventos;
    if (filtro) list = list.filter(e => e.categoria === filtro);

    document.getElementById('evResumen').textContent = `${list.length} evento(s)`;
    const badge = document.getElementById('unreadBadge');
    badge.textContent = unreadCount;
    badge.style.display = unreadCount > 0 ? '' : 'none';

    const lista = document.getElementById('evLista');
    if (!list.length) { lista.innerHTML = '<div class="empty">No hay eventos recientes.</div>'; return; }

    lista.innerHTML = list.map(e => {
      const dot = CAT_COLORS[e.categoria] || 'operacion';
      const cls = e.leido ? '' : 'no-leido';
      const timeAgo = getTimeAgo(e.created_at);
      return `<div class="evt ${cls}" data-id="${e.id}">
        <div class="evt-dot ${dot}"></div>
        <div style="flex:1;min-width:0">
          <div class="u-row u-gap2" style="align-items:center;flex-wrap:wrap">
            <span class="evt-titulo">${esc(e.titulo)}</span>
            <span class="evt-badge ${CAT_BADGE[e.categoria] || 'badge--mute'}">${CAT_LABELS[e.categoria] || e.categoria}</span>
            ${!e.leido ? '<span style="width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0"></span>' : ''}
          </div>
          ${e.descripcion ? `<div class="evt-desc">${esc(e.descripcion)}</div>` : ''}
          <div class="evt-time">${timeAgo}${e.actor_nombre ? ' · ' + esc(e.actor_nombre) : ''}</div>
        </div>
      </div>`;
    }).join('');

    lista.querySelectorAll('.evt').forEach(el => el.addEventListener('click', async () => {
      const id = Number(el.getAttribute('data-id'));
      const ev = eventos.find(e => e.id === id);
      if (ev && !ev.leido) {
        ev.leido = 1;
        unreadCount = Math.max(0, unreadCount - 1);
        render();
        api(`/api/events/${id}/read`, { method: 'POST' }).catch(() => {});
      }
    }));
  }

  function getTimeAgo(ts) {
    if (!ts) return '';
    const t = new Date(ts);
    const s = Math.floor((Date.now() - t.getTime()) / 1000);
    if (s < 60) return 'hace ' + Math.max(1, s) + 's';
    if (s < 3600) return 'hace ' + Math.floor(s / 60) + 'min';
    if (s < 86400) return 'hace ' + Math.floor(s / 3600) + 'h';
    return t.toLocaleDateString('es-CO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  // SSE para eventos en tiempo real
  if (typeof EventSource !== 'undefined') {
    try {
      const sse = new EventSource('/api/stream');
      sse.addEventListener('evento', () => { cargar(); });
      sse.onerror = () => sse.close();
    } catch (e) {}
  }

  await cargar();
  setInterval(cargar, 30000);
})();
</script>
</body>
</html>
