<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>GalerÃ­a SP Leons Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
<script src="/os/theme.js"></script>
<style>
  :root{
    --bg:#0A0A0A; --gold:#FFD76A; --gold-2:#C07F1E; --gold-3:#FFE08A;
    --txt:#F8F8F8; --txt-2:rgba(248,248,248,.6); --txt-3:rgba(248,248,248,.35);
    --glass:rgba(42,38,30,.10); --glass-2:rgba(50,45,35,.16);
    --glass-border:rgba(248,244,230,.14); --blur-sm:saturate(1.6) blur(10px);
    --green:#4E7B46;
    --grad-gold:linear-gradient(140deg,#FFE08A,var(--gold) 60%,#C07F1E);
    --grad-gold-text:linear-gradient(135deg,#FFE08A,var(--gold) 55%,#C07F1E);
    --aurora-1a:rgba(248,248,248,.15); --aurora-1b:rgba(248,248,248,.05);
    --aurora-2a:rgba(248,248,248,.11); --aurora-2b:rgba(248,248,248,.04);
    --aurora-gold-1:rgba(255,215,106,.22); --aurora-green:rgba(78,123,70,.16); --aurora-gold-2:rgba(255,215,106,.10);
    --aurora-gold-3:rgba(237,204,96,.07);
  }
  :root[data-theme="light"]{
    --bg:#F4EFE3; --gold:#FFD76A; --gold-2:#C07F1E; --gold-3:#FFE08A;
    --txt:#221C10; --txt-2:rgba(34,28,16,.66); --txt-3:rgba(34,28,16,.47);
    --glass:rgba(255,251,241,.30); --glass-2:rgba(255,252,245,.44);
    --glass-border:rgba(168,138,78,.15); --blur-sm:saturate(1.6) blur(10px);
    --green:#3F6538;
    --aurora-1a:rgba(255,215,106,.14); --aurora-1b:rgba(255,215,106,.04);
    --aurora-2a:rgba(200,160,80,.09); --aurora-2b:rgba(200,160,80,.03);
    --aurora-gold-1:rgba(255,215,106,.20); --aurora-green:rgba(78,123,70,.13); --aurora-gold-2:rgba(237,204,96,.12);
    --aurora-gold-3:rgba(214,178,96,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh;min-height:100dvh;font-family:'Inter',system-ui,sans-serif;color:var(--txt);
    font-optical-sizing:auto;letter-spacing:-0.011em;
    padding:0;margin:0;
    background:
      radial-gradient(circle 260px at 15% 18%, var(--aurora-1a), var(--aurora-1b) 52%, transparent 62%),
      radial-gradient(circle 200px at 85% 60%, var(--aurora-2a), var(--aurora-2b) 54%, transparent 64%),
      radial-gradient(700px 500px at 85% -10%, var(--aurora-gold-1), transparent 60%),
      radial-gradient(600px 550px at -10% 105%, var(--aurora-green), transparent 60%),
      radial-gradient(520px 420px at 50% 92%, var(--aurora-gold-3), transparent 62%),
      var(--bg);
    background-attachment:fixed;
  }

  /* Navegacion superior â€” glass premium */
  .nav{
    position:sticky;top:0;z-index:100;
    padding:14px 20px;
    background:var(--glass-2);
    backdrop-filter:var(--blur-sm);-webkit-backdrop-filter:var(--blur-sm);
    border-bottom:1px solid var(--glass-border);
    display:flex;align-items:center;gap:12px;
  }
  .nav-back{
    width:36px;height:36px;border-radius:12px;border:1px solid var(--glass-border);
    background:var(--glass);color:var(--txt-2);font-size:1.1rem;display:flex;
    align-items:center;justify-content:center;cursor:pointer;text-decoration:none;
    flex-shrink:0;
  }
  .nav-back:active{opacity:.7;transform:scale(.94)}
  .nav-title{
    font-family:'Cinzel',Georgia,serif;font-size:.95rem;letter-spacing:.1em;
    background:var(--grad-gold-text);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nav-sub{
    font-family:'Cormorant Garamond',serif;font-size:.82rem;color:var(--txt-3);
    font-style:italic;margin-left:auto;flex-shrink:0;
  }

  /* Categorias */
  .pills{
    padding:16px 20px 0;display:flex;gap:8px;flex-wrap:wrap;
  }
  .pill{
    padding:8px 18px;border-radius:24px;font-size:.78rem;font-weight:600;
    letter-spacing:.02em;cursor:pointer;transition:all .15s;
    border:1px solid var(--glass-border);background:var(--glass);
    color:var(--txt-2);font-family:inherit;white-space:nowrap;
  }
  .pill.active{
    background:var(--grad-gold);color:#0A0A0A;border-color:transparent;
  }
  .pill:active:not(.active){background:var(--glass-2);transform:scale(.96)}

  /* Grid de galeria */
  .grid{
    padding:20px;display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:14px;
  }
  @media(min-width:600px){
    .grid{grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));gap:16px}
  }

  .item{
    border-radius:18px;overflow:hidden;cursor:pointer;
    background:var(--glass-2);border:1px solid var(--glass-border);
    backdrop-filter:var(--blur-sm);-webkit-backdrop-filter:var(--blur-sm);
    transition:transform .15s, box-shadow .15s;
    position:relative;
  }
  .item:active{transform:scale(.97)}
  .item-thumb{
    width:100%;aspect-ratio:9/16;overflow:hidden;position:relative;
    background:rgba(0,0,0,.3);
  }
  .item-paysage .item-thumb{aspect-ratio:16/9}
  .item-thumb img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .3s ease;
  }
  .item:hover .item-thumb img{transform:scale(1.04)}
  .item-tag{
    position:absolute;top:8px;right:8px;
    padding:3px 10px;border-radius:8px;font-size:.6rem;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;
    background:rgba(10,10,10,.75);color:var(--gold);
    border:1px solid rgba(255,215,106,.25);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .item-info{
    padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;
  }
  .item-name{
    font-size:.78rem;font-weight:600;color:var(--txt);
    line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .item-actions{
    display:flex;gap:6px;
  }
  .btn-download{
    flex:1;padding:8px 10px;border-radius:10px;border:none;cursor:pointer;
    background:var(--grad-gold);color:#0A0A0A;
    font-size:.72rem;font-weight:700;font-family:inherit;letter-spacing:.03em;
    display:flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;
  }
  .btn-download:active{opacity:.85;transform:scale(.96)}
  .btn-preview{
    width:32px;height:32px;border-radius:10px;border:1px solid var(--glass-border);
    background:var(--glass);color:var(--txt-2);
    font-size:.85rem;cursor:pointer;display:flex;
    align-items:center;justify-content:center;flex-shrink:0;
  }
  .btn-preview:active{opacity:.7;transform:scale(.94)}

  /* Modal preview */
  .modal-overlay{
    position:fixed;inset:0;z-index:9999;
    background:rgba(0,0,0,.88);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .2s, visibility .2s;
  }
  .modal-overlay.open{opacity:1;visibility:visible}
  .modal{
    max-width:90vw;max-height:85vh;width:auto;height:auto;
    border-radius:22px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    position:relative;cursor:default;
  }
  .modal img{display:block;max-width:90vw;max-height:85vh;object-fit:contain;border-radius:22px}
  .modal-download{
    position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    padding:14px 32px;border-radius:14px;border:none;cursor:pointer;
    background:var(--grad-gold);color:#0A0A0A;
    font-size:.88rem;font-weight:700;font-family:inherit;letter-spacing:.03em;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    display:flex;align-items:center;gap:8px;text-decoration:none;
    white-space:nowrap;z-index:10;
  }
  .modal-download:active{opacity:.85;transform:translateX(-50%) scale(.96)}
  .modal-close{
    position:absolute;top:14px;right:14px;
    width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(15,15,15,.8);color:var(--txt);
    font-size:1.3rem;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.15);z-index:10;
  }
  .modal-close:active{transform:scale(.92)}

  /* Estado vacio */
  .empty{
    grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--txt-3);
  }
  .empty-icon{font-size:2rem;margin-bottom:12px}
  .empty-msg{font-size:.85rem}

  /* Toast */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    padding:12px 24px;border-radius:14px;font-size:.82rem;font-weight:600;
    background:var(--glass-2);color:var(--txt);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--glass-border);
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    z-index:10000;opacity:0;visibility:hidden;
    transition:opacity .25s, visibility .25s;
  }
  .toast.show{opacity:1;visibility:visible}

  @supports(corner-shape:squircle){
    *,*::before,*::after{corner-shape:squircle}
    [style*="border-radius:50%"],[style*="border-radius: 50%"]{corner-shape:round}
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-back" title="Volver">&larr;</a>
  <span class="nav-title">GALERÃA SP LEONS</span>
  <span class="nav-sub">Recursos del grupo</span>
</nav>

<div class="pills" id="pills">
  <button class="pill active" data-cat="all">Todo</button>
  <button class="pill" data-cat="fondos">Fondos de pantalla</button>
  <button class="pill" data-cat="logos">Logos</button>
  <button class="pill" data-cat="banners">Banners</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modalOverlay">
  <button class="modal-close" id="modalClose">&times;</button>
  <a class="modal-download" id="modalDownload" href="#" download>â¬‡ Descargar</a>
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let assets = [];

async function fetchAssets(cat) {
  let url = '/api/galeria';
  if (cat && cat !== 'all') url += '?categoria=' + encodeURIComponent(cat);
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    assets = Array.isArray(j) ? j : [];
  } catch (e) {
    assets = [];
  }
}

const grid = document.getElementById('grid');
const pills = document.getElementById('pills');
const modalOverlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');
const modalDownload = document.getElementById('modalDownload');
const modalClose = document.getElementById('modalClose');
const toast = document.getElementById('toast');

let currentCat = 'all';
let currentPreview = null;
let toastTimer = null;

function showToast(msg){
  if(toastTimer) clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(()=>{toast.classList.remove('show')}, 1800);
}

function renderGrid(cat){
  currentCat = cat;
  const filtered = cat === 'all' ? assets : assets.filter(a => a.categoria === cat);
  if(!filtered.length){
    grid.innerHTML = `<div class="empty"><div class="empty-icon">&#128444;</div><div class="empty-msg">PrÃ³ximamente mÃ¡s recursos</div></div>`;
    return;
  }
  grid.innerHTML = filtered.map(a => {
    const isBanner = a.categoria === 'banners';
    const catTag = a.categoria === 'fondos' ? 'Fondo' : a.categoria === 'logos' ? 'Logo' : 'Banner';
    const name = a.nombre || '';
    const file = a.filename || '';
    return `<div class="item${isBanner?' item-paysage':''}" data-file="${esc(file)}">
      <div class="item-thumb">
        <img src="/galeria/assets/${esc(file)}" alt="${esc(name)}" loading="lazy">
        <span class="item-tag">${catTag}</span>
      </div>
      <div class="item-info">
        <span class="item-name">${esc(name)}</span>
        <div class="item-actions">
          <a class="btn-download" href="/galeria/assets/${esc(file)}" download onclick="onDownload(event,'${esc(name)}')">Descargar</a>
          <button class="btn-preview" onclick="event.preventDefault();event.stopPropagation();openPreview('${esc(file)}','${esc(name)}')" title="Vista previa">&#x1F50D;</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function openPreview(file, name){
  modalContent.innerHTML = `<img src="/galeria/assets/${esc(file)}" alt="${esc(name)}">`;
  modalDownload.href = '/galeria/assets/' + esc(file);
  modalDownload.setAttribute('download', file);
  modalOverlay.classList.add('open');
}

function closePreview(){
  modalOverlay.classList.remove('open');
  modalContent.innerHTML = '';
}

modalClose.addEventListener('click', closePreview);
modalOverlay.addEventListener('click', function(e){
  if(e.target === modalOverlay) closePreview();
});

function onDownload(e, name){
  showToast('Descargando ' + name);
}

// Pill navigation
document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', function(){
    document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    renderGrid(this.dataset.cat);
  });
});

// Modal swipe to close (touch)
let touchStartY = 0;
modalOverlay.addEventListener('touchstart', function(e){
  touchStartY = e.touches[0].clientY;
});
modalOverlay.addEventListener('touchmove', function(e){
  const dy = e.touches[0].clientY - touchStartY;
  if(dy > 80) closePreview();
});

(async () => {
  await fetchAssets('all');
  renderGrid('all');
})();
</script>
</body>
</html>
