<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Leons Group · SP Feed · Supervisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
<script src="/os/theme.js"></script>
<link rel="stylesheet" href="/os/sp-os.css">
</head>
<body>
<script src="/os/sp-shell.js"></script>
<script src="/supervisor/supervisor-shell.js"></script>
<script src="/supervisor/feed-app.js"></script>
<script>
(async function () {
  'use strict';
  const { me, content } = await SPS.mount({ active: 'feed', title: 'SP Feed', crumb: 'Supervisor Center · Actividad en tiempo real' });
  if (!content) return;

  const ICONS = (window.SPOS && window.SPOS.ICONS) || {};
  const avatarColor = (window.SPS && SPS.avatarColor) || (() => '#D4AF37');
  const initials = (window.SPS && SPS.initials) || ((n) => String(n || '?').slice(0, 2).toUpperCase());

  window.SPFeed.init({
    host: content,
    me,
    api: SPS.api,
    toast: (m, k) => SPS.toast(m, k),
    icons: ICONS,
    avatarColor,
    initials,
    conversacionesUrl: '/supervisor/conversaciones.html',
  });

  // Toggle entre el feed de actividad (tiempo real) y el feed multimedia de marca
  const toggle = document.createElement('div');
  toggle.style.cssText = 'display:flex;gap:8px;margin-bottom:4px';
  toggle.innerHTML = `
    <a class="chip active" href="/supervisor/feed.html" style="text-decoration:none">Actividad en tiempo real</a>
    <a class="chip" href="/supervisor/feed-marca.html" style="text-decoration:none">Multimedia de marca</a>`;
  content.querySelector('.feed-filters').before(toggle);
})();
</script>
</body>
</html>
